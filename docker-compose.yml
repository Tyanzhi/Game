services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: world_engine
      POSTGRES_USER: world_engine
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://world_engine:change_me@postgres:5432/world_engine
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
