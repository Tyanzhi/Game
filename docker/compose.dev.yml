services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: world_engine
      POSTGRES_USER: world_engine
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - world_engine_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - world_engine_redis:/data

volumes:
  world_engine_pg:
  world_engine_redis:
