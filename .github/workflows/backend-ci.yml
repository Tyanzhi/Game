name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: world_engine_test
          POSTGRES_USER: world_engine
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U world_engine -d world_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r app/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q app alembic ../simulation
      - name: Check undefined names and syntax
        run: ruff check --select E9,F63,F7,F82 app tests alembic ../simulation
      - name: Run tests
        env:
          PYTHONPATH: .:..
        run: pytest -q . ../simulation
      - name: Verify migrations and simulation on PostgreSQL
        env:
          PYTHONPATH: .:..
          MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://world_engine:test_password@localhost:5432/world_engine_test
        run: pytest -q tests/test_migrations.py
      - name: Smoke import API
        env:
          PYTHONPATH: .:..
        run: python -c "from app.main import app; print(app.title)"
