name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: world_engine_test
          POSTGRES_USER: world_engine
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U world_engine -d world_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r app/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q app alembic ../simulation
      - name: Check undefined names and syntax
        run: ruff check --select E9,F63,F7,F82 app tests alembic ../simulation
      - name: Run tests
        env:
          PYTHONPATH: .:..
        run: pytest -q . ../simulation
      - name: Verify migrations and simulation on PostgreSQL
        env:
          PYTHONPATH: .:..
          MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://world_engine:test_password@localhost:5432/world_engine_test
        run: pytest -q tests/test_migrations.py
      - name: Smoke import API
        env:
          PYTHONPATH: .:..
        run: python -c "from app.main import app; print(app.title)"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build


  production-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose
        env:
          POSTGRES_PASSWORD: test_password
        run: docker compose -f docker-compose.prod.yml config
      - name: Build production backend image
        run: docker build -t world-engine-backend:ci ./backend
      - name: Start production runtime
        env:
          POSTGRES_PASSWORD: test_password
          WORLD_ENGINE_API_PORT: "8000"
          LIVE_INTELLIGENCE_INTERVAL_SECONDS: "3600"
        run: docker compose -f docker-compose.prod.yml up -d --build
      - name: Wait for API readiness
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs api live-worker migrate
          exit 1
      - name: Verify runtime roles
        env:
          POSTGRES_PASSWORD: test_password
        run: |
          curl --fail http://127.0.0.1:8000/health/live
          docker compose -f docker-compose.prod.yml ps --status running api
          docker compose -f docker-compose.prod.yml ps --status running live-worker
      - name: Runtime logs on failure
        if: failure()
        env:
          POSTGRES_PASSWORD: test_password
        run: docker compose -f docker-compose.prod.yml logs --no-color
      - name: Stop production runtime
        if: always()
        env:
          POSTGRES_PASSWORD: test_password
        run: docker compose -f docker-compose.prod.yml down -v
