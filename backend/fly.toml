app = "world-engine"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ROLE = "api"
  AUTO_CREATE_SCHEMA = "0"
  EMBEDDED_LIVE_SCHEDULER = "0"
  LIVE_INTELLIGENCE_INTERVAL_SECONDS = "300"
  LIVE_SIMULATION_ID = "live-world"
  LIVE_WORKER_LEASE_SECONDS = "900"
  LIVE_WORKER_STANDBY_POLL_SECONDS = "30"
  CORS_ALLOWED_ORIGINS = "https://world-engine-07x9.netlify.app,https://geopolitica20261.netlify.app"

[processes]
  api = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
  worker = "python -m app.live_worker"

[deploy]
  release_command = "alembic upgrade head"
  strategy = "rolling"
  wait_timeout = "10m"
  release_command_timeout = "10m"

[http_service]
  processes = ["api"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/health/ready"
    timeout = "5s"

[[vm]]
  processes = ["api"]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[[vm]]
  processes = ["worker"]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
