name: world-engine-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: world_engine
      POSTGRES_USER: world_engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U world_engine -d world_engine"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://world_engine:${POSTGRES_PASSWORD}@postgres:5432/world_engine
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://world_engine:${POSTGRES_PASSWORD}@postgres:5432/world_engine
      REDIS_URL: redis://redis:6379/0
      APP_ROLE: api
      AUTO_CREATE_SCHEMA: "0"
      EMBEDDED_LIVE_SCHEDULER: "0"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://geopolitica20261.netlify.app}
      LIVE_SIMULATION_ID: ${LIVE_SIMULATION_ID:-live-world}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    ports:
      - "${WORLD_ENGINE_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  live-worker:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://world_engine:${POSTGRES_PASSWORD}@postgres:5432/world_engine
      REDIS_URL: redis://redis:6379/0
      APP_ROLE: worker
      LIVE_INTELLIGENCE_INTERVAL_SECONDS: ${LIVE_INTELLIGENCE_INTERVAL_SECONDS:-300}
      LIVE_SIMULATION_ID: ${LIVE_SIMULATION_ID:-live-world}
    command: ["python", "-m", "app.live_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
